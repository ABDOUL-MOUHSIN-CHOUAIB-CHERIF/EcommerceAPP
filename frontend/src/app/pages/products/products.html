<app-navbar></app-navbar>

<div class="products-page">

    <section class="products-header">
        <h1 class="products-title">Explore Everest Collection</h1>
        <p class="products-subtitle">Premium products curated for modern lifestyle.</p>
    </section>

    <div *ngIf="isLoading" class="loading-container">
        <div class="loader"></div> 
        <p>Loading products...</p>
    </div>

    <div *ngIf="errorMessage" class="error-container">
        <h3>Something went wrong</h3>
        <p>{{ errorMessage }}</p>
        <button class="retry-btn" (click)="retryLoading()">Retry</button>
    </div>

    <div *ngIf="!isLoading && products.length === 0 && !errorMessage" class="empty-container">
        <h3>No products found</h3>
    </div>

    <div class="products-grid" *ngIf="!isLoading && products.length > 0">

        <div class="product-card" *ngFor="let p of products" (click)="goToProduct(p.id)">

            <div class="product-card__image-wrap">
                <!-- ✅ FIXED: Image with fallback -->
                <img
                    [src]="p.image_url || 'https://picsum.photos/280/280?random=' + p.id"
                    [alt]="p.name"
                    class="product-card__image"
                    loading="lazy"
                    decoding="async"
                    (error)="p.image_url = 'https://picsum.photos/280/280?random=' + p.id"
                >
            </div>

            <div class="product-card__info">
                <span class="product-card__category">{{ p.category }}</span>
                <h3 class="product-card__name">{{ p.name }}</h3>
                <p class="product-card__description">{{ p.description | slice:0:80 }}...</p>

                <div class="product-card__bottom">
                    <div class="product-card__price">
                        <span class="product-card__currency">CFA</span>
                        <span class="product-card__value">{{ p.price | number }}</span>
                    </div>
                    <button class="product-card__view-btn" (click)="$event.stopPropagation(); goToProduct(p.id)">
                        View
                    </button>
                </div>
            </div>

        </div>

    </div>

</div>

<app-footer></app-footer>
